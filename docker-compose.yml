services:
  broker:
    build: .
    container_name: task-queue-broker
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"

  worker:
    build: .
    container_name: task-queue-worker
    command: python -m src.worker.worker
    depends_on:
      - broker
    environment:
      - BROKER_BASE_URL=http://broker:8000